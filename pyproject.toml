[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "goldcoast"
version = "0.1.0"
description = "Dynamic local-business ad generation from Olympic hype moments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "google-genai",
  "httpx",
  "pillow",
  "pydantic>=2",
  "python-dotenv",
  "sse-starlette",
  "typer",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[project.scripts]
goldcoast = "goldcoast.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
